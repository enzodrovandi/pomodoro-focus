name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Windows curses support
        run: python -m pip install -r requirements-windows.txt
      - name: Run non-Unix tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest test_focus test_history test_history_views test_home test_ui test_windows_console_smoke -v
      - name: Exercise the Windows console interface
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python .github/scripts/windows_console_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
